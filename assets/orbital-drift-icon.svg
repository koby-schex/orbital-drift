<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Orbital Drift</title>
  <desc id="desc">A luminous starship crossing a cyan and violet orbital ring.</desc>
  <defs>
    <radialGradient id="space" cx="36%" cy="24%" r="86%">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset=".46" stop-color="#11183b"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7dd3fc"/>
      <stop offset=".55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0f172a"/>
      <stop offset=".5" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#space)"/>
  <circle cx="110" cy="100" r="5" fill="#fff" opacity=".8"/>
  <circle cx="398" cy="126" r="3" fill="#fde68a" opacity=".9"/>
  <circle cx="424" cy="360" r="5" fill="#7dd3fc" opacity=".7"/>
  <ellipse cx="256" cy="256" rx="180" ry="92" transform="rotate(-22 256 256)" fill="none" stroke="url(#orbit)" stroke-width="18" opacity=".35" filter="url(#glow)"/>
  <ellipse cx="256" cy="256" rx="180" ry="92" transform="rotate(-22 256 256)" fill="none" stroke="url(#orbit)" stroke-width="7"/>
  <g transform="translate(274 242) rotate(-22)" filter="url(#glow)">
    <path d="M-102-20 16-50 108 0 16 50-102 20-66 0Z" fill="url(#ship)" stroke="#e0f2fe" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-28-12 36-27 72 0 36 27-28 12Z" fill="#38bdf8" opacity=".56"/>
    <path d="M-105-10-164 0-105 10Z" fill="#fde68a"/>
  </g>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="3"/>
</svg>
