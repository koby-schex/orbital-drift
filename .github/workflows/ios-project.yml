name: Verify iOS Simulator Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ios-project.yml
      - scripts/smoke-ios-simulator.sh
      - scripts/prepare-ios-release.mjs
      - scripts/render-ios-app-icon.swift
      - scripts/install-ios-storekit.mjs
      - native/ios/**
      - tests/ios-wrapper.mjs
      - capacitor.config.json
      - package.json
      - index.html
      - assets/**
      - manifest.webmanifest
      - sw.js
      - scripts/build-mobile.mjs
  push:
    branches:
      - main
    paths:
      - .github/workflows/ios-project.yml
      - capacitor.config.json
      - package.json
      - index.html
      - assets/**
      - manifest.webmanifest
      - sw.js
      - scripts/build-mobile.mjs
      - scripts/smoke-ios-simulator.sh
      - scripts/prepare-ios-release.mjs
      - scripts/render-ios-app-icon.swift
      - scripts/install-ios-storekit.mjs
      - native/ios/**

permissions:
  contents: read

jobs:
  ios-project:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Capacitor toolchain
        run: npm install --no-package-lock
      - name: Run gameplay and packaging validation
        run: npm test
      - name: Build bundled game
        run: npm run build:mobile
      - name: Verify available Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Generate native iOS project with Swift Package Manager
        run: |
          npx cap add ios --packagemanager SPM
          npx cap sync ios
      - name: Enforce portrait-only iPhone orientation
        run: |
          PLIST="ios/App/App/Info.plist"
          test -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations:0" "$PLIST" | grep -Fx UIInterfaceOrientationPortrait
      - name: Apply Orbital Drift native branding and version metadata
        run: node scripts/prepare-ios-release.mjs
      - name: Compile unsigned iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/orbital-drift-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -d "$RUNNER_TEMP/orbital-drift-derived-data/Build/Products/Debug-iphonesimulator/App.app"
      - name: Boot iPhone Simulator and verify app launch, relaunch and screenshot
        run: bash scripts/smoke-ios-simulator.sh
      - name: Upload native Simulator smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-drift-ios-simulator-smoke-evidence
          path: ${{ runner.temp }}/orbital-drift-simulator-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload unsigned iOS source project
        uses: actions/upload-artifact@v4
        with:
          name: orbital-drift-ios-source-after-simulator-build
          path: ios/
          if-no-files-found: error
          retention-days: 7
